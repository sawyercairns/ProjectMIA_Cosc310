services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: projectuser
      POSTGRES_PASSWORD: projectpassword
      POSTGRES_DB: projectdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://projectuser:projectpassword@db:5432/projectdb
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - INTERNAL_API_URL=http://app:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - app

volumes:
  postgres_data:

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: projectuser
      POSTGRES_PASSWORD: projectpassword
      POSTGRES_DB: projectdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://projectuser:projectpassword@db:5432/projectdb
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: 6LfhXCAsAAAAAIoqk3RLs6VTw0L93LY_xmbK3c5a
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LfhXCAsAAAAAIoqk3RLs6VTw0L93LY_xmbK3c5a
    depends_on:
      - backend

volumes:
  postgres_data:
  